name: Build Jawa Timur AC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Android project ZIP
        run: |
          unzip -q jawatimurac-project.zip -d source

      - name: Build debug APK
        working-directory: source/jawatimurac-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jawa-timur-ac-apk
          path: source/jawatimurac-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
