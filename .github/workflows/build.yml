name: Build Jawa Timur AC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract, repair splash resources, and build APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -q jawatimurac-project.zip -d source

          APP_GRADLE="$(find source -type f -path '*/app/build.gradle' -print -quit)"
          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: Tidak menemukan app/build.gradle setelah ZIP diekstrak."
            echo "Pastikan jawatimurac-project.zip berisi folder proyek Android."
            find source -maxdepth 4 -type f | head -80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          RES_DIR="$PROJECT_DIR/app/src/main/res"
          mkdir -p "$RES_DIR/drawable" "$RES_DIR/values"

          cat > "$RES_DIR/drawable/splash_background.xml" <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/splash_background_color" />
              <item android:gravity="center" android:drawable="@drawable/splash_logo" />
          </layer-list>
          XML

          cat > "$RES_DIR/values/colors.xml" <<'XML'
          <resources>
              <color name="splash_background_color">#071937</color>
          </resources>
          XML

          echo "Building project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-output/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jawa-timur-ac-apk
          path: apk-output/app-debug.apk
          if-no-files-found: error
